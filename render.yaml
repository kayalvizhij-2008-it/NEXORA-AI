services:
  - type: web
    name: nexora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /ok
    autoDeploy: true
    envVars:
      - key: PORT
        value: "2024"
      - key: HOST
        value: "0.0.0.0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
